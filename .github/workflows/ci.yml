name: CI

# This is the only build environment there is: docs/windows-port.md sets out that nothing is
# compiled locally, so a green run here is what "done" means for every milestone.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and measure
    runs-on: windows-latest
    # Writing is for the release a v* tag makes (M8); every other run only reads.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # M8: a v1.2.3 tag makes release 1.2.3; anything else builds as a development version.
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') {
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
            "release=true" >> $env:GITHUB_OUTPUT
          } else {
            "version=0.0.0-dev" >> $env:GITHUB_OUTPUT
            "release=false" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The eight upstream kernels, built twice from the same sources: a static library the
      # NativeAOT link pulls in, and a DLL the test run loads at run time. The script finds the
      # C++ toolchain with vswhere, so it keeps working when the runner image moves to a newer
      # Visual Studio.
      - name: Build C kernels
        id: kernels
        shell: pwsh
        run: |
          ./native/kernels/build.ps1 -OutputDirectory build/kernels
          "static=$(Resolve-Path build/kernels/static/compositor_kernels.lib)" >> $env:GITHUB_OUTPUT
          "shared=$(Resolve-Path build/kernels/shared/compositor_kernels.dll)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Compositor_korean_win.sln

      # The Core layer touches nothing but System.* and the kernels, so it tests without a backend
      # and without a display — which is what keeps the test suite honest as the shell grows.
      - name: Test
        run: >
          dotnet test tests/Compositor_korean_win.Core.Tests/Compositor_korean_win.Core.Tests.csproj
          --configuration Release
          --no-restore
          -p:KernelSharedPath="${{ steps.kernels.outputs.shared }}"
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory build/test-results

      # The PSD tests leave their exports in build/psd-out; psd-tools, a reader written
      # independently of ours, has to read them as we meant them (docs/progress.md 14).
      - name: Check exported PSDs with psd-tools
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check psd-tools
          python scripts/check_psd.py build/psd-out

      # Restoring again rather than reusing the solution restore: the NativeAOT compiler and the
      # win-x64 runtime pack only get pulled in once the RuntimeIdentifier is in play, which the
      # solution-wide restore does not do.
      - name: Publish (NativeAOT, single file)
        run: >
          dotnet publish src/Compositor_korean_win.Shell/Compositor_korean_win.Shell.csproj
          --configuration Release
          --runtime win-x64
          -p:KernelLibraryPath="${{ steps.kernels.outputs.static }}"
          -p:Version=${{ steps.version.outputs.version }}
          --output build/publish

      # M7: the plain build — no ONNX Runtime referenced, no model, the exe the size it was. Built
      # from the same sources with background removal compiled out.
      - name: Publish the plain build
        run: >
          dotnet publish src/Compositor_korean_win.Shell/Compositor_korean_win.Shell.csproj
          --configuration Release
          --runtime win-x64
          -p:KernelLibraryPath="${{ steps.kernels.outputs.static }}"
          -p:WithAi=false
          -p:Version=${{ steps.version.outputs.version }}
          --output build/publish-plain

      # M7: the background-removal model, which only the AI build carries. Fetched once and kept in
      # the cache — 115 MB is not worth downloading on every push — and pinned to its hash, so a
      # changed upload cannot slip in under the same name.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: build/models
          key: birefnet-lite-fp16-d39b897c

      - name: Fetch the model
        shell: pwsh
        run: |
          $model = "build/models/birefnet-lite-fp16.onnx"
          if (-not (Test-Path $model)) {
            New-Item -ItemType Directory -Force build/models | Out-Null
            Invoke-WebRequest "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_fp16.onnx" -OutFile $model
          }
          $hash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "d39b897ceb16ae654c1731f3dba0cf9b368d9cae74b5a57459b455cc8bfec402") { throw "model hash $hash" }
          New-Item -ItemType Directory -Force build/publish/models | Out-Null
          Copy-Item $model build/publish/models/
          Get-ChildItem build/publish -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      # M0 closes on figures, not on a screenshot. The runner has no GPU and no display, so this
      # is WARP with the window hidden: a floor, not a target.
      - name: Self-test and measure
        id: selftest
        shell: pwsh
        continue-on-error: true
        run: |
          # Start-Process, not the call operator: this is a GUI-subsystem executable, which
          # PowerShell launches without waiting for, so $LASTEXITCODE would never be its own.
          $arguments = @("--selftest", "--image", "assets/m0-test.png", "--report", "build/m0-report.json")
          $process = Start-Process -FilePath "build/publish/Compositor_korean_win.exe" `
                                   -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          "exit=$($process.ExitCode)" >> $env:GITHUB_OUTPUT
          if ($process.ExitCode -ne 0) { Write-Host "self-test exited with $($process.ExitCode)" }

      # The plain build runs the same self-test: everything but the model has to pass there too,
      # and Remove Background has to be present and unable to run.
      - name: Self-test the plain build
        id: plaintest
        shell: pwsh
        continue-on-error: true
        run: |
          # Its own folder, so its screenshots do not overwrite the AI build's.
          New-Item -ItemType Directory -Force build/plain | Out-Null
          $arguments = @("--selftest", "--image", "assets/m0-test.png", "--report", "build/plain/report.json")
          $process = Start-Process -FilePath "build/publish-plain/Compositor_korean_win.exe" `
                                   -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          "exit=$($process.ExitCode)" >> $env:GITHUB_OUTPUT

      # MCP from a model's side: a Python client starts the program with --mcp and builds a poster
      # from the tools alone, then psd-tools reads the PSD it saved (docs/progress.md 15).
      - name: Make a poster through MCP
        id: poster
        shell: pwsh
        run: |
          python scripts/mcp_poster.py build/publish/Compositor_korean_win.exe build/mcp-poster
          if ($LASTEXITCODE -ne 0) { throw "the MCP poster run failed" }
          python scripts/check_psd.py build/mcp-poster
          if ($LASTEXITCODE -ne 0) { throw "psd-tools could not read the MCP poster" }

      # The open window's pipe (docs/progress.md 25): start the editor as a person would, then work
      # in it from PowerShell with the function the Help menu hands out, and through --mcp, which
      # has to find the window and relay to it rather than start a windowless server.
      - name: Work in the open window through its pipe
        shell: pwsh
        run: |
          function Compositor([string]$json) { $p = [IO.Pipes.NamedPipeClientStream]::new('.', 'compositor-korean-win', 'InOut'); try { $p.Connect(5000); $e = [Text.UTF8Encoding]::new($false); $w = [IO.StreamWriter]::new($p, $e); $r = [IO.StreamReader]::new($p, $e); $w.WriteLine($json); $w.Flush(); $r.ReadLine() } finally { $p.Dispose() } }
          function Call([string]$json) {
            $answer = Compositor $json | ConvertFrom-Json
            if (-not $answer.ok) { throw "$json failed: $($answer.text)" }
            return $answer
          }

          $window = Start-Process -FilePath "build/publish/Compositor_korean_win.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
              try { $null = Compositor '{"tool":"guide"}'; $ready = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "the window never opened its pipe" }

            $guide = Call '{"tool":"guide"}'
            if ($guide.text -notmatch 'add_text') { throw "the guide does not list the tools" }

            $before = Call '{"tool":"get_document"}'
            $added = Call '{"tool":"add_text","arguments":{"text":"파이프","x":200,"y":300,"size":120,"color":"#E02020"}}'
            $shown = Call '{"tool":"render"}'
            if (-not (Test-Path $shown.images[0])) { throw "render did not write its PNG" }
            $after = Call '{"tool":"get_document"}'
            if ($after.text -notmatch '파이프') { throw "the text did not reach the window's document: $($after.text)" }

            $undone = Call '{"tool":"undo"}'
            if ($undone.text -notmatch 'Undid 1') { throw "undo did not go to the window's history: $($undone.text)" }
            $back = Call '{"tool":"get_document"}'
            if ($back.text -match '파이프') { throw "undo left the text in place" }

            # --mcp relays to the window: the document it reports is the window's, not a new one.
            $relay = python -c "import subprocess,json,sys; p=subprocess.run(['build/publish/Compositor_korean_win.exe','--mcp'],input=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{'name':'get_document','arguments':{}}})+'\n',capture_output=True,text=True,encoding='utf-8',timeout=60); print(p.stdout.strip()); print('STDERR:'+p.stderr.strip())"
            if ($LASTEXITCODE -ne 0) { throw "the --mcp relay did not run" }
            $relayText = $relay -join "`n"
            if ($relayText -notmatch 'working in the open window') { throw "--mcp did not find the window: $relayText" }
            if ($relayText -match 'No document is open') { throw "--mcp answered from a server of its own: $relayText" }

            "## 열린 창 연결" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- 파이프로 안내·문서 조회·텍스트 추가·렌더·실행 취소, `--mcp` 중계 모두 통과" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
          finally {
            if (-not $window.HasExited) { Stop-Process -Id $window.Id -Force }
          }

      # A run started by hand also puts the poster on the mcp-results branch, where it can be looked
      # at without downloading artifacts.
      - name: Publish the poster for review
        if: github.event_name == 'workflow_dispatch' && steps.poster.outcome == 'success'
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
        run: |
          $out = "build/mcp-results"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/mcp-poster/poster-render.png, build/mcp-poster/poster.png, build/mcp-poster/layers.json $out
          Push-Location $out
          git init -q
          git checkout -q -b mcp-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "MCP poster from run $env:GITHUB_RUN_ID ($env:GITHUB_SHA)"
          git push -q -f "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:mcp-results
          Pop-Location

      - name: Report
        shell: pwsh
        run: |
          $exe = Get-Item build/publish/Compositor_korean_win.exe -ErrorAction SilentlyContinue
          $shipped = Get-ChildItem build/publish -File |
                     Where-Object { $_.Extension -in '.exe', '.dll' }

          "## M0 — 기반 검증" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY

          if (Test-Path build/m0-report.json) {
            $report = Get-Content build/m0-report.json -Raw | ConvertFrom-Json

            "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 단일 exe | {0:N0} KB |" -f ($report.exeBytes / 1KB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 첫 프레임까지 | {0:N1} ms |" -f $report.timeToFirstFrameMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 최대 작업 집합 | {0:N1} MB |" -f ($report.peakWorkingSetBytes / 1MB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 관리 힙 | {0:N0} KB |" -f ($report.managedHeapBytes / 1KB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 드라이버 | $($report.driver) / $($report.featureLevel) / $($report.adapter) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 선택된 픽셀 포맷 | **$($report.chosenFormat)** |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| RGBA 렌더 타깃 | $($report.r8g8b8a8.renderTarget) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| BGRA 렌더 타깃 | $($report.b8g8r8a8.renderTarget) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| WIC 디코드 | $($report.wicDecoded) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 창 표시·프레젠트 | $($report.windowPresented) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| C 커널 ABI | $($report.kernelAbi) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append $env:GITHUB_STEP_SUMMARY

            if ($null -ne $report.canvasDocumentPixels) {
              "### M3 — 캔버스" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 문서 크기 | {0:N0} 픽셀 |" -f $report.canvasDocumentPixels | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 창 크기 | {0:N0} 픽셀 |" -f $report.canvasViewPixels | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 한 프레임이 읽는 픽셀 | {0:N0} |" -f $report.canvasPixelsRead | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 창 픽셀의 4배 이내 | $($report.canvasWithinBudget) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 프레임 시간 (맞춤) | {0:N1} ms |" -f $report.canvasFittedFrameMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 프레임 시간 (100%) | {0:N1} ms |" -f $report.canvasFullSizeFrameMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 벤치 포함 최대 작업 집합 | {0:N1} MB |" -f ($report.canvasPeakWorkingSetBytes / 1MB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "프레임 시간은 러너 어댑터($($report.adapter)) 수치이므로 기록만 하고 판정에 쓰지 않는다." |
                Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }

            if ($null -ne $report.strokeLargeAppendMs) {
              "### M4 — 도구" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 스트로크 지연 (1메가픽셀 레이어) | {0:N2} ms |" -f $report.strokeSmallAppendMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 스트로크 지연 (1억 픽셀 레이어) | {0:N2} ms |" -f $report.strokeLargeAppendMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 칠하는 중 프레임 시간 | {0:N1} ms |" -f $report.strokeLiveFrameMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 스트로크가 만진 타일 | $($report.strokeTilesTouched)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 레이어 크기와 무관 | $($report.strokeWithinBudget) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }

            if ($null -ne $report.adjustPixelsPerFrame) {
              "### M5 — 조정·필터" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 조정 레이어 | $($report.adjustLayers)개 (문서 {0:N0} 픽셀, 창 {1:N0} 픽셀) |" -f $report.adjustDocumentPixels, $report.adjustViewPixels | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 한 프레임이 조정한 픽셀 | {0:N0} |" -f $report.adjustPixelsPerFrame | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 프레임 시간 (조정 없음 / 있음 / 값 변경 중) | {0:N1} / {1:N1} / {2:N1} ms |" -f $report.adjustPlainFrameMs, $report.adjustFrameMs, $report.adjustChangeFrameMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 필터 프리뷰 열기 | {0:N1} ms |" -f $report.previewOpenMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 필터 프리뷰 (맞춤) | {0:N1} ms, {1:N0} 픽셀 |" -f $report.previewFittedMs, $report.previewFittedPixels | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 필터 프리뷰 (100%) | {0:N1} ms, {1:N0} 픽셀 |" -f $report.previewFullSizeMs, $report.previewFullSizePixels | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 백엔드 차이 (조정 레이어) | 최대 $($report.renderAdjustedMax), 평균 {0:N3} |" -f $report.renderAdjustedMean | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 종류별 (창 한 장) | Hue/Sat {0:N1} · Levels {1:N1} · Curves {2:N1} · Exposure {3:N1} · Gradient Map {4:N1} · Grain {5:N1} ms |" -f $report.adjustMsHsv, $report.adjustMsLevels, $report.adjustMsCurves, $report.adjustMsExposure, $report.adjustMsGradientMap, $report.adjustMsGrain | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 백엔드 차이 (필터·디스토트 프리뷰) | 최대 $($report.renderPreviewedMax), 평균 {0:N3} |" -f $report.renderPreviewedMean | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 창 크기에 비례 | $($report.adjustWithinBudget) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }

            if ($null -ne $report.menuItems) {
              "### M6 — UI·다국어" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 메뉴 항목 (영어+한국어) | $($report.menuItems)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 번역 안 된 항목 | $($report.menuUntranslated)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 실행해 본 명령 | $($report.menuCommandsRun)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 한국어 실행 취소 이름 | $($report.menuKoreanUndo) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 통과 | $($report.menuPassed) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 패널이 그린 문구 (두 언어, 모든 도구) | $($report.panelStrings)개, 번역 안 됨 $($report.panelUntranslated)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 스크린샷 | $($report.panelScreenshots) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 저장·열기 왕복 (레이어 $($report.filesLayers)개) | 최대 픽셀 차이 $($report.filesMaximumDifference) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 탭·끌어다 놓기 | 최대 탭 $($report.filesTabs)개, 통과 $($report.filesPassed) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 마스크 칠하기·문지르기·픽셀 유동화 | 확인 $($report.toolsChecks)개, 통과 $($report.toolsPassed) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 배경 제거 모델 | $($report.aiDevice), 불러오기 {0:N0} ms, 추론 {1:N0} ms |" -f $report.aiLoadMs, $report.aiRunMs | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "| 피사체 판별 (안 / 밖) | {0:N2} / {1:N2}, 통과 $($report.aiPassed) |" -f $report.aiInside, $report.aiOutside | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            }

            if ($report.failures.Count -gt 0) {
              "### 실패" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              $report.failures | ForEach-Object { "- $_" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
            }
          } else {
            "자체 검사가 보고서를 남기지 못했습니다." | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

          if (Test-Path build/plain/report.json) {
            $plain = Get-Content build/plain/report.json -Raw | ConvertFrom-Json
            "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "### M7 — AI 미포함판" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 항목 | 값 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 단일 exe | {0:N0} KB |" -f ($plain.exeBytes / 1KB) | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 모델 | 설치 $($plain.aiInstalled), 통과 $($plain.aiPassed) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| 실패 | $($plain.failures.Count)개 |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $plain.failures | ForEach-Object { "- $_" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }

          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "### 배포물" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "배포 폴더의 파일 $($shipped.Count)개, 합계 {0:N0} KB" -f (($shipped | Measure-Object Length -Sum).Sum / 1KB) |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          $shipped | ForEach-Object { "- ``$($_.Name)`` {0:N0} KB" -f ($_.Length / 1KB) | Out-File -Append $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-build
          path: |
            build/m0-report.json
            build/plain/report.json
            build/*.png
            build/test-results/**
            build/mcp-poster/**
          if-no-files-found: warn

      # The two downloads: the plain build, the exe alone; and the AI build, the exe with ONNX
      # Runtime, DirectML and the model beside it. Each carries the licences of what is in it.
      - name: Package
        shell: pwsh
        run: |
          $packages = New-Item -ItemType Directory -Force build/packages
          $notices = @("LICENSE", "THIRD-PARTY-NOTICES.md")

          $plain = New-Item -ItemType Directory -Force build/package-plain
          Copy-Item build/publish-plain/Compositor_korean_win.exe $plain
          Copy-Item $notices $plain
          Compress-Archive -Path "$plain/*" -DestinationPath "$packages/Compositor_korean_win.zip" -Force

          $ai = New-Item -ItemType Directory -Force build/package-ai
          Copy-Item build/publish/Compositor_korean_win.exe, build/publish/onnxruntime.dll,
                    build/publish/onnxruntime_providers_shared.dll, build/publish/DirectML.dll $ai
          Copy-Item build/publish/models (Join-Path $ai models) -Recurse
          Copy-Item $notices $ai
          $licences = New-Item -ItemType Directory -Force (Join-Path $ai licenses)
          $nuget = Join-Path $env:USERPROFILE .nuget/packages
          Copy-Item "$nuget/microsoft.ml.onnxruntime.directml/1.24.4/LICENSE" "$licences/onnxruntime-LICENSE.txt"
          Copy-Item "$nuget/microsoft.ai.directml/1.15.4/LICENSE.txt" "$licences/DirectML-LICENSE.txt"
          Copy-Item "$nuget/microsoft.ai.directml/1.15.4/ThirdPartyNotices.txt" "$licences/DirectML-ThirdPartyNotices.txt"
          Copy-Item licenses/BiRefNet-LICENSE.txt $licences
          Compress-Archive -Path "$ai/*" -DestinationPath "$packages/Compositor_korean_win-ai.zip" -Force

          Get-ChildItem $packages | ForEach-Object { "- ``$($_.Name)`` {0:N1} MB" -f ($_.Length / 1MB) } |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      # M8: the installers, per user and removable from Settings > Apps. Inno Setup is on the
      # runner image; if a newer image drops it, Chocolatey puts it back.
      - name: Build the installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $version = "${{ steps.version.outputs.version }}" -replace '-dev$', ''
          & $iscc /Q "/DAppVersion=$version" "/DSource=..\build\package-plain" "/DWithAi=0" `
                  "/DOutputName=Compositor_korean_win-setup" installer/Compositor_korean_win.iss
          if ($LASTEXITCODE -ne 0) { throw "plain installer: $LASTEXITCODE" }
          & $iscc /Q "/DAppVersion=$version" "/DSource=..\build\package-ai" "/DWithAi=1" `
                  "/DOutputName=Compositor_korean_win-ai-setup" installer/Compositor_korean_win.iss
          if ($LASTEXITCODE -ne 0) { throw "AI installer: $LASTEXITCODE" }
          Get-ChildItem build/installers | ForEach-Object { "- ``$($_.Name)`` {0:N1} MB" -f ($_.Length / 1MB) } |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      # What the user asked of it: installs per user, shows in Settings > Apps, and uninstalling
      # leaves nothing — not the program folder, not the settings, not the registry entry. Run for
      # real on the runner: the AI build, the plain build over it, then the uninstaller.
      - name: Install, switch and uninstall
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\Compositor_korean_win"
          $settings = Join-Path $env:APPDATA "Compositor_korean_win"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F3C2A51-6D4B-4E7A-9C1E-2B5D7F0A9E34}_is1"
          function Setup($file, $arguments) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$file exited with $($process.ExitCode)" }
          }
          $quiet = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")

          Setup "build/installers/Compositor_korean_win-ai-setup.exe" $quiet
          foreach ($file in "Compositor_korean_win.exe", "onnxruntime.dll", "DirectML.dll", "models\birefnet-lite-fp16.onnx") {
            if (-not (Test-Path (Join-Path $app $file))) { throw "the AI build did not install $file" }
          }
          if (-not (Test-Path $key)) { throw "no entry under Settings > Apps" }
          $entry = Get-ItemProperty $key
          "- 설치 위치: ``$($entry.InstallLocation)``, 표시 이름: $($entry.DisplayName) $($entry.DisplayVersion)" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

          Setup "build/installers/Compositor_korean_win-setup.exe" $quiet
          if (Test-Path (Join-Path $app "onnxruntime.dll")) { throw "the plain build left the AI runtime behind" }
          if (Test-Path (Join-Path $app "models")) { throw "the plain build left the model behind" }

          # Settings the app would have written, so the uninstaller has something to take.
          New-Item -ItemType Directory -Force $settings | Out-Null
          Set-Content (Join-Path $settings "settings.json") '{"language":"ko"}'

          Setup (Join-Path $app "unins000.exe") $quiet
          # The uninstaller hands off to a copy of itself in %TEMP% and returns first.
          for ($i = 0; $i -lt 60 -and ((Test-Path $app) -or (Test-Path $key)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw "the program folder is still there: $(Get-ChildItem $app -Recurse | Select-Object -ExpandProperty FullName)" }
          if (Test-Path $settings) { throw "the settings are still there" }
          if (Test-Path $key) { throw "the Settings > Apps entry is still there" }
          "- 설치 → 미포함판으로 교체 → 제거: 프로그램 폴더·설정·등록 정보 모두 사라짐" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Compositor_korean_win
          path: build/package-plain/**
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Compositor_korean_win-ai
          path: build/package-ai/**
          retention-days: 14

      # The NativeAOT symbols for the exes above, kept out of the packages. A hang in the field can
      # only be located from a dump of the stuck process, and a NativeAOT dump without its PDB shows
      # bare addresses. Matched to the build by the run, so each run carries its own.
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor_korean_win-symbols
          path: |
            build/publish-plain/*.pdb
            build/publish/*.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Fail if the self-test did not pass
        if: steps.selftest.outputs.exit != '0'
        shell: pwsh
        run: |
          if (Test-Path build/m0-report.json) { Get-Content build/m0-report.json -Raw | Write-Host }
          throw "self-test exited with $('${{ steps.selftest.outputs.exit }}')"

      # M8: a v* tag publishes everything above as a GitHub release, with the update feed the app
      # reads (Help > Check for Updates) and checksums. Only after both self-tests have passed.
      - name: Release
        if: steps.version.outputs.release == 'true' && steps.selftest.outputs.exit == '0' && steps.plaintest.outputs.exit == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $out = New-Item -ItemType Directory -Force build/release
          Copy-Item build/installers/Compositor_korean_win-setup.exe "$out/Compositor_korean_win-$version-setup.exe"
          Copy-Item build/installers/Compositor_korean_win-ai-setup.exe "$out/Compositor_korean_win-ai-$version-setup.exe"
          Copy-Item build/packages/Compositor_korean_win.zip "$out/Compositor_korean_win-$version.zip"
          Copy-Item build/packages/Compositor_korean_win-ai.zip "$out/Compositor_korean_win-ai-$version.zip"
          $page = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          @{ version = $version; page = $page } | ConvertTo-Json | Set-Content "$out/update.json" -Encoding utf8NoBOM
          # LF line endings, so `sha256sum -c` reads it as it comes; Set-Content would write CRLF.
          $sums = Get-ChildItem $out -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $out "SHA256SUMS.txt"), ($sums -join "`n") + "`n")
          gh release create $tag (Get-ChildItem $out -File).FullName --title "Compositor 한국어판 $version" --notes-file installer/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create: $LASTEXITCODE" }

      - name: Fail if the plain build's self-test did not pass
        if: steps.plaintest.outputs.exit != '0'
        shell: pwsh
        run: |
          if (Test-Path build/plain/report.json) { Get-Content build/plain/report.json -Raw | Write-Host }
          throw "plain self-test exited with $('${{ steps.plaintest.outputs.exit }}')"
